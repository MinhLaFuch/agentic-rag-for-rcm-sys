[project]
name = "ecom-agentic-recsys"
version = "0.0.1"
description = "Agentic recommendation system on Amazon Reviews 2023 (research-grade project)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.0.0,<3.1.0",
    "numpy>=2.5.0,<2.6.0",
    "PyYAML>=6.0.2,<6.1.0",
    "scipy>=1.14.0,<1.19.0",
    "pyarrow>=18.0.0,<19.0.0",
    "httpx>=0.27.0,<0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0,<9.2.0",
]
demo = [
    "gradio>=4.0.0,<5.0.0",
]

[build-system]
requires = ["setuptools>=68,<75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["package*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_file = "experiments/agent_eval/component_benchmarks/pytest.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"