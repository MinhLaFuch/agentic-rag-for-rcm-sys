campaign_id: "campaign_001_parameter_grid"
description: "Parameter grid search: agents x inference_mode x reflect_rounds"

dataset:
  tag: "default"  # Data tag for resource paths
  split: "validation"  # validation or test
  filters:
    domains: ["Video_Games"]

# Parameter grid: auto-generate all combinations
# This will create 3 agents x 2 inference_modes x 2 reflect_rounds = 12 experiments
parameter_grid:
  agents:
    - ["baseline", "type1"]  # Baseline agents
    - ["planner"]            # Planner only
    - ["planner_memory"]     # Planner with memory
  inference_mode:
    - "template"  # No LLM for answer (deterministic)
    - "llm"       # LLM for answer (slower)
  reflect_rounds:
    - 0  # No reflection
    - 2  # 2 reflection rounds

# Alternative: Explicit experiments (comment out parameter_grid to use this instead)
# experiments:
#   - name: "baseline_template"
#     agent_config:
#       agents: ["baseline", "type1"]
#       inference_mode: "template"
#       reflect_rounds: 0
#     evaluation_config:
#       per_segment: 20
#     repetition_count: 1
#   - name: "planner_llm_reflect2"
#     agent_config:
#       agents: ["planner"]
#       inference_mode: "llm"
#       reflect_rounds: 2
#     evaluation_config:
#       per_segment: 20
#     repetition_count: 1

# Auto-generate comparison pairs for all vs baseline
# For parameter grid, this is auto-generated based on first experiment
comparison_pairs: []
# If you want specific comparisons, uncomment and fill:
# - ["exp_1_agents_[baseline, type1]_inference_mode_template_reflect_rounds_0", "exp_2_agents_[planner]_inference_mode_template_reflect_rounds_0"]

statistical_settings:
  confidence_level: 0.95
  bootstrap_samples: 1000
  paired_comparison: true

# Tương đối experiments_dir (experiments/) — KHÔNG phải CWD. Xem configs/path/data_paths.yaml.
output_dir: "agent_eval/campaigns/campaign_001"

metadata:
  author: "evaluation team"
  created: "2026-11-03"
  purpose: "Parameter grid search for agents, inference modes, and reflection rounds"
