campaign_id: "campaign_001_baseline_vs_improved"
description: "Compare baseline agent with improved planner and memory"

dataset:
  path: "data/evaluation/test_set.jsonl"
  version: "v1.0"
  split: "test"
  filters:
    domains: ["Video_Games"]

experiments:
  - name: "baseline"
    description: "Baseline agent with default planner and memory"
    agent_config:
      model: "gpt-4"
      provider: "openai"
      temperature: 0.0
      planner_type: "default"
      memory_enabled: true
    evaluation_config:
      layers: [1, 2, 3, 4, 5]
      request_kinds: ["similar", "personalized", "constrained", "cold_text", "ambiguous"]
      metrics:
        - task_success_rate
        - grounded_answer_rate
        - constraint_satisfaction
    repetition_count: 3
    random_seed: 42
    tags: ["baseline"]

  - name: "improved_planner"
    description: "Agent with improved planner (better tool selection)"
    agent_config:
      model: "gpt-4"
      provider: "openai"
      temperature: 0.0
      planner_type: "improved_v1"
      memory_enabled: true
    evaluation_config:
      layers: [1, 2, 3, 4, 5]
      request_kinds: ["similar", "personalized", "constrained", "cold_text", "ambiguous"]
      metrics:
        - task_success_rate
        - grounded_answer_rate
        - constraint_satisfaction
    repetition_count: 3
    random_seed: 42
    tags: ["planner_ablation"]

  - name: "improved_memory"
    description: "Agent with improved memory (better profile usage)"
    agent_config:
      model: "gpt-4"
      provider: "openai"
      temperature: 0.0
      planner_type: "default"
      memory_enabled: true
      memory_type: "improved_v1"
    evaluation_config:
      layers: [1, 2, 3, 4, 5]
      request_kinds: ["similar", "personalized", "constrained", "cold_text", "ambiguous"]
      metrics:
        - task_success_rate
        - grounded_answer_rate
        - constraint_satisfaction
    repetition_count: 3
    random_seed: 42
    tags: ["memory_ablation"]

  - name: "full_improved"
    description: "Agent with both improved planner and memory"
    agent_config:
      model: "gpt-4"
      provider: "openai"
      temperature: 0.0
      planner_type: "improved_v1"
      memory_enabled: true
      memory_type: "improved_v1"
    evaluation_config:
      layers: [1, 2, 3, 4, 5]
      request_kinds: ["similar", "personalized", "constrained", "cold_text", "ambiguous"]
      metrics:
        - task_success_rate
        - grounded_answer_rate
        - constraint_satisfaction
    repetition_count: 3
    random_seed: 42
    tags: ["full_improved"]

comparison_pairs:
  - ["baseline", "improved_planner"]
  - ["baseline", "improved_memory"]
  - ["baseline", "full_improved"]
  - ["improved_planner", "full_improved"]
  - ["improved_memory", "full_improved"]

statistical_settings:
  confidence_level: 0.95
  bootstrap_samples: 1000
  paired_comparison: true

output_dir: "experiments/agent_eval/campaigns/campaign_001"

metadata:
  author: "evaluation team"
  created: "2026-11-02"
  purpose: "Validate improvements to planner and memory components"
