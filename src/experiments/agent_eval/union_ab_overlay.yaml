# A/B overlay: replicate campaign_005 exp_5 (planner, template, reflect_rounds=0)
# with the union-candidates prompt + $union.candidates support.
# Multi-turn eval and Jev judge disabled — they don't affect trajectories.
agent/agent_eval:
  agent_eval:
    agents:
    - planner
    allow_missing_corpus_sources: true
    trajectory_file: union_ab_exp_1_run1_trajectories.jsonl
    campaign_id: null
    per_segment: 20
    request_scope: all
    multi_turn:
      enabled: false
    jev:
      enabled: false
    experiment_dir: C:\Users\ph181\Documents\Repositories\agentic-rag-for-rcm-sys\src\experiments\agent_eval\union_ab\exp_1_union_prompt\run_1
    item_knn_reuse_cache: true
path/data_paths:
  paths:
    item_knn_dir: experiments/agent_eval/campaigns/campaign_005/item_knn
agent/inference:
  inference:
    mode: template
agent/agent:
  agent:
    reflect_rounds: 0
eval/baselines:
  baselines:
    seed: 42
