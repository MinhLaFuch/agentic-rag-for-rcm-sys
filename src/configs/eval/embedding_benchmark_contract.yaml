version: 1
tag: multi_domain
data_protocol: temporal_train_core
metadata_policy: historical_static_catalog
seed: 42
pilot:
  provider: sentence_transformers
  model: sentence-transformers/all-MiniLM-L6-v2
  expected_dimension: 384
  max_seq_length: 256
  text_protocol: title_store_main_category_categories_sorted_v2
  sampling: seeded_reservoir_balanced_by_domain_v1
  default_limit: 1000
  repeats: 2
  warmup_items: 8
retrieval:
  evaluation_split: validation
  budgets: [50, 100, 200]
  primary_metric: macro_recall_at_100
  sources: [popularity, item_cf, bm25, dense, hybrid]
  fusion: rrf
  rrf_k: 60
  cohort_identity: freeze_user_ids_and_query_artifact_before_comparison
  confidence_interval: paired_bootstrap_95_percent
  history_track:
    query_source: fit_history_titles_only
    query_items: 3
    cold_without_history: no_input_and_report_fallback_separately
    segments: [cold, sparse, warm]
  cold_query_track:
    status: dataset_pending
    rule: query_and_judgments_independent_of_held_out_targets
  category_oracle: diagnostic_upper_bound_only
  error_handling: record_error_separately_from_retrieval_miss
  gates:
    status: set_after_resource_pilot_before_large_validation
    quality_delta_minimum: null
    cohort_regression_limit: null
    p95_query_latency_ms: null
    peak_ram_gib: null
test_policy: freeze_configuration_before_test_no_test_tuning
