# Segment thresholds config (mục XVI, XVII, XX).
# Phân khúc dùng trong offline evaluator. Với k-core 5/5, user có 1–4
# tương tác trong tập fit vẫn được xem là sparse; từ 5 trở lên là warm.
# User không có history trong tập fit được evaluator gán là cold.

segment_thresholds:
  sparse_max_history: 4
