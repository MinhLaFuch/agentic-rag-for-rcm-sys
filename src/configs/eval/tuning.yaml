# Tuning config (mục VIII, XX).
# Chọn cấu hình chỉ bằng validation; không dùng test cho hyperparameter search.

tuning:
  selection_metric: "ndcg@10"
  run_final_test: false      # true = refit cấu hình thắng trên train+validation rồi đánh giá test MỘT lần (chỉ bật sau khi đã review model được chọn)
  models: [popularity, item_knn, bpr_mf]   # danh sách model tuning mặc định
  item_knn:
    k: [10, 20, 50, 100]
  bpr_mf:
    embedding_dim: [32, 64]
    learning_rate: [0.001, 0.005]
    reg: [0.001, 0.01]
    epochs: [20]
