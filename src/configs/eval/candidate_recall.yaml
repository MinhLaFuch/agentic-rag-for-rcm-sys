# Candidate recall config (mục IX, X, XX).
# Dùng bởi scripts/evaluation/candidate_recall.py. k của ItemKNN lấy từ baselines.yaml
# (baselines.item_knn.k) và seed lấy từ baselines.seed.

candidate_recall:
  budgets: [50, 100, 200]   # số candidate N cần đo
  per_segment: 1000         # số user tối đa lấy mẫu mỗi segment
  seed_items: 10            # số item gần nhất làm seed cho ItemCF
  query_items: 3            # số title gần nhất ghép thành semantic query
  query_modes: [history]    # history (realistic offline proxy) và/hoặc category_oracle (oracle upper bound — KHÔNG báo cáo như kết quả thật)
  metadata_policy: "historical_static_catalog"  # historical_static_catalog | snapshot
  query_normalization: "raw"                  # raw | ascii_fold — tiền xử lý query metadata; ascii_fold phải có baseline riêng
  use_prebuilt_corpus: true                   # false = build corpus trong RAM
  allow_missing_corpus_sources: false         # true = chấp nhận corpus prebuilt khi thiếu file meta thô
  min_metadata_coverage: 0.5   # dưới tỉ lệ item mapping có metadata này thì dừng (sai file meta / sai định dạng id)
  # experiments_subdir: "candidate_recall" → giờ là outputs.candidate_recall trong configs/path/data_paths.yaml
