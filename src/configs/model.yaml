# Model config (mục VIII, XX). Model sequential cụ thể CHƯA được chốt
# ở Phase 0/1 — giá trị dưới đây là placeholder, sẽ được xác định ở Phase 5
# dựa trên EDA thật (xem docs/decisions.md D-004).

baselines:
  # Schema được dùng bởi scripts/run_baselines.py.
  seed: 42
  popularity_fallback: true
  item_knn:
    k: 20
    # Số phần tử dense tối đa mỗi block khi xây item-item similarity.
    block_elements: 20000000
  bpr_mf:
    embedding_dim: 64
    learning_rate: 0.001
    reg: 0.01
    epochs: 20
    batch_size: 2048

tuning:
  # Chọn cấu hình chỉ bằng validation; không dùng test cho hyperparameter search.
  selection_metric: "ndcg@10"
  item_knn:
    k: [10, 20, 50, 100]
  bpr_mf:
    embedding_dim: [32, 64]
    learning_rate: [0.001, 0.005]
    reg: [0.001, 0.01]
    epochs: [20]

sequential:
  # model_name sẽ được chốt ở Phase 5 (candidate: SASRec, BERT4Rec...)
  model_name: "TBD_PHASE_5"
  max_sequence_length: 50
  embedding_dim: 64
  negative_samples: 1
  batch_size: 256
  learning_rate: 0.001
  epochs: 50
