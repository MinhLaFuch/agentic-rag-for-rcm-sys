# Retrieval config (mục IX, X, XX).

candidate_retrieval:
  top_n: 100
  strategy: "hybrid"   # collaborative | embedding | semantic | hybrid
  cache_enabled: true
  cache_ttl_seconds: 3600

semantic_retrieval:
  # embedding_model sẽ được chốt ở Phase 6 sau khi so sánh vài lựa chọn
  embedding_model: "TBD_PHASE_6"
  index_backend: "faiss"
  top_k: 20
  max_context_items: 20   # giới hạn cứng — không đưa toàn bộ dataset vào prompt

deterministic_filter:
  # filter theo constraint cứng (budget, category...) trước khi vào LLM rerank
  enabled: true

# Dùng bởi scripts/py/candidate_recall.py. k của ItemKNN lấy từ model.yaml
# (baselines.item_knn.k) và seed lấy từ baselines.seed.
candidate_recall:
  budgets: [50, 100, 200]   # số candidate N cần đo
  per_segment: 1000         # số user tối đa lấy mẫu mỗi segment
  seed_items: 10            # số item gần nhất làm seed cho ItemCF
  query_items: 3            # số title gần nhất ghép thành semantic query
  experiments_subdir: "candidate_recall"   # nằm trong experiments/

