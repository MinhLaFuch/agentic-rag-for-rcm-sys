# Data paths config (mục V, XX) — NGUỒN DUY NHẤT cho mọi thư mục của project.
# Code chỉ lấy đường dẫn qua package.config.get_data_paths(); shell qua `python -m package.config path:<tên>`.
# Đường dẫn tương đối so với gốc project (thư mục chứa configs/).
#
# Thư mục có phân biệt ngữ nghĩa — KHÔNG gộp:
#   resource/…       dữ liệu pipeline (raw, cleaned, filtered, mapped, splits)
#   experiments/     kết quả thí nghiệm + tất cả log (exp_NNN/, logs/, test_logs/)
#   experiments/logs/ log của pipeline/tool (stage logs, run_tools.log, etc.)
#   experiments/test_logs/ log của test
#   experiments/baselines/ thí nghiệm baseline model
#   experiments/agent_eval/ thí nghiệm agent evaluation
#   experiments/data_pipeline/ thí nghiệm data pipeline
#   experiments/smoke_tests/ thí nghiệm smoke test

paths:
  raw_dir: "resource/raw"            # <Domain>.jsonl.gz và meta_<Domain>.jsonl.gz
  cleaned_dir: "resource/cleaned"    # <Domain>/interactions.parquet (stage 1)
  filtered_dir: "resource/filtered"  # <run_tag>/interactions.parquet (stage 2)
  mapped_dir: "resource/mapped"      # <run_tag>/{user2id,item2id}.json (stage 3)
  splits_dir: "resource/splits"      # <run_tag>/{train,validation,test}.parquet (stage 3)
  item_knn_dir: "resource/item_knn"  # <run_tag>/item_knn_<tag>_<eval_on>.npz — cached ItemKNN similarity matrix
  corpus_dir: "resource/corpus"      # <run_tag>/corpus_<tag>.sqlite — cached ItemCorpus SQLite database
  log_dir: "experiments/logs"       # <run_tag>/*.log — log của pipeline/tool (vd run_tools.log, stage logs)
  experiments_dir: "experiments"     # exp_NNN/… (baselines, tuning); candidate_recall ghi vào <experiments_dir>/<experiments_subdir>
