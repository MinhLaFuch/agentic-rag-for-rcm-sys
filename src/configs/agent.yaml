# Agent config (mục IV, XII, XIV, XX, XXI).
# reference architecture: InteRecAgent/RecAI (xem docs/decisions.md D-003b)

llm:
  provider: "mock"       # mock | openai_compatible — đổi sang openai_compatible khi có endpoint thật (Phase 8)
  model: "mock-0"
  base_url: null         # ví dụ: "http://localhost:8000/v1" cho vLLM/Ollama, hoặc "https://api.openai.com/v1"
  api_key: null          # để trống nếu server local không cần auth; KHÔNG commit key thật vào file này
  timeout_seconds: 30.0

reranking:
  input_top_k: 20        # LLM chỉ nhận Top-20, không nhận toàn bộ catalog (mục XIV)
  output_top_k: 10
  require_json_output: true

memory:
  max_records_per_retrieve: 10   # không nhồi toàn bộ memory vào context (mục XI)
  types:
    - short_term
    - long_term
    - preference
    - interaction

single_agent:
  max_tool_calls_per_request: 8   # giới hạn để kiểm soát cost/latency
  workflow:
    - intent_understanding
    - profile_retrieval
    - memory_retrieval
    - candidate_retrieval
    - constraint_filtering
    - candidate_analysis
    - reranking
    - explanation
    - memory_update

multi_agent:
  enabled: false   # Phase 10 mới nghiên cứu (mục XIII) — KHÔNG bật mặc định
