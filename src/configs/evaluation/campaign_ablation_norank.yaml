# Ablation campaign: -Rank (planner_memory, template, reflect=1, KHÔNG RankTool).
# So sánh với campaign_001 exp_10 (cùng cấu hình nhưng full toolset) bằng
# scripts/experiments/compare_experiments.py + pairwise_ablation.py sau khi chạy.
# Chạy: python scripts/evaluation/run_campaign.py --campaign-config configs/evaluation/campaign_ablation_norank.yaml
#
# multi_turn=false: ablation scope là single-turn scored.jsonl; bật lại nếu cần
# multi-turn metrics cho arm này (tốn thêm LLM calls).

campaign_id: "campaign_001_ablation_norank"
description: "Ablation -Rank: planner_memory without RankTool (vs campaign_001 exp_10)"

dataset:
  split: "validation"
  filters:
    domains: ["Video_Games", "Toys_and_Games", "Electronics"]

experiments:
  - name: exp_1_planner_memory_template_r1_norank
    description: "planner_memory, inference template, reflect_rounds=1, exclude_tools=[RankTool]"
    agent_config:
      agents: ["planner_memory"]
      inference_mode: "template"
      reflect_rounds: 1
      exclude_tools: ["RankTool"]
      multi_turn: false
    evaluation_config:
      per_segment: 20
    repetition_count: 1
    random_seed: 42
    tags: ["ablation", "norank"]

default_agents: ["planner_memory"]
allow_missing_corpus_sources: true
experiment_timeout_seconds: 7200

comparison_pairs: []

statistical_settings:
  confidence_level: 0.95
  bootstrap_samples: 1000
  paired_comparison: true

output_dir: "agent_eval/campaigns/campaign_001_ablation_norank"
multi_turn: "never"
