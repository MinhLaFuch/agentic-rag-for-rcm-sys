# Data config (mục V, XX).
# Dữ liệu thô tải về máy rồi đặt trong resource/raw/ (xem scripts/sh/download_review_data.sh),
# không đọc qua HuggingFace.

# Danh sách domain bật trong hệ thống (xem docs/decisions.md D-010).
# Thứ tự ở đây là thứ tự các script .sh lặp qua.
domains:
  - name: "Video_Games"
    role: "primary"
  - name: "Toys_and_Games"
    role: "secondary"
    adjacency: "audience"      # bổ trợ theo đối tượng khách hàng
  - name: "Electronics"
    role: "secondary"
    adjacency: "functional"    # bổ trợ theo chức năng sản phẩm (accessory/hardware)

# Tên một lần chạy multi-domain. Stage 2/3 ghi vào <filtered|mapped|splits>_dir/<run_tag>/.
# Thử ít domain hơn? Chạy với TAG=vg_toys để không ghi đè bản chạy đủ.
run_tag: "multi_domain"

paths:
  raw_dir: "resource/raw"            # <Domain>.jsonl.gz và meta_<Domain>.jsonl.gz
  cleaned_dir: "resource/cleaned"    # <Domain>/interactions.parquet (stage 1)
  filtered_dir: "resource/filtered"  # <run_tag>/interactions.parquet (stage 2)
  mapped_dir: "resource/mapped"      # <run_tag>/{user2id,item2id}.json (stage 3)
  splits_dir: "resource/splits"      # <run_tag>/{train,validation,test}.parquet (stage 3)

download:
  # {domain} được thay bằng tên domain.
  review_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/review_categories/{domain}.jsonl.gz"
  meta_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/meta_categories/meta_{domain}.jsonl.gz"

cleaning:
  min_review_length_chars: 1
  drop_duplicate_reviews: true
  chunk_size: 250000     # số review xử lý mỗi lần ở stage 1; giảm nếu hết RAM

filtering:
  # k-core filtering — giá trị thật sẽ chốt ở Phase 2 sau EDA, đây là default placeholder
  min_user_interactions: 5
  min_item_interactions: 5

split:
  strategy: "temporal"   # bắt buộc theo mục VI — không dùng random split
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
