# Agent evaluation config (mục XVI, XVII, XVIII, XX). Dùng bởi scripts/evaluation/run_agent_eval.py.
# LLM lấy từ llm.yaml, giới hạn executor từ agent.yaml, ItemKNN k + seed từ baselines.yaml,
# ngưỡng cold/sparse/warm từ segment_thresholds.yaml.

agent_eval:
  agents: [baseline, type1, planner, planner_memory]
  # baseline       ItemKNN + popularity fallback, không LLM, chạy được cho mọi request có user (E2 trên cùng tập request)
  # type1          plan cố định ItemCF -> RecoModel -> Query, không LLM, chỉ áp dụng cho request "similar"
  # planner        LLM lập plan với 4 tool (ItemCF, RecoModel, Query, SemanticSearch)            (E6)
  # planner_memory như planner + MemoryTool                                                       (E7)
  k: 10                 # cutoff của metric VÀ số gợi ý được yêu cầu trong câu request
  per_segment: 20       # số request mỗi (kind, segment); tổng số lần gọi LLM ~ số request x số agent LLM
  n_ambiguous: 6        # số request cố ý thiếu thông tin (kỳ vọng agent hỏi lại, không bịa id)
  language: "vi"        # ngôn ngữ câu request: vi | en
  price_slack: 1.25     # ngân sách của request "constrained" = giá item bị giấu x hệ số này, làm tròn lên
  price_round_to: 5     # bội số làm tròn của ngân sách (đơn vị USD)
  min_metadata_coverage: 0.5      # dưới tỉ lệ item mapping có metadata này thì dừng (sai file meta / sai định dạng id)
  # Per-domain overrides; domains not listed inherit min_metadata_coverage.
  min_metadata_coverage_by_domain: {}
  trajectory_error_chars: 300     # lỗi của step / plan bị cắt còn chừng này ký tự trong file trajectory (cùng mức inference.reason_chars)
  max_consecutive_llm_errors: 5   # lỗi provider (timeout/auth...) liên tiếp từng này lần thì dừng cả lần chạy
  trajectory_file: "agent_eval_trajectories.jsonl"  # ghi dần trong log_dir để --resume được; cuối lần chạy copy vào exp_NNN/ (experiments/agent_eval/, xem outputs: trong path/data_paths.yaml)
  request_scope: "realistic"     # realistic | oracle | all — realistic loại request dùng target metadata; oracle chỉ chạy các request đó; all gộp cả hai
  enable_session: false          # true = tạo Session mới cho mỗi request (nền tảng multi-turn; hiện eval vẫn single-turn)
  metadata_policy: "historical_static_catalog"  # historical_static_catalog | snapshot — default mask aggregate price/rating không có version; snapshot là so sánh non-causal
  use_prebuilt_corpus: true      # false = build corpus trong RAM thay vì đọc corpus prebuilt (debug/tag nhỏ)
  allow_missing_corpus_sources: false  # true = chấp nhận corpus prebuilt khi thiếu file meta thô (schema + item mapping vẫn được kiểm)
  campaign_id: null         # campaign runner điền vào qua CONFIG_OVERLAY_PATH khi chạy trong campaign (traceability exp -> campaign); null khi chạy riêng
  exclude_tools: []         # ablation: tên class tool bị loại khỏi planner/planner_memory (vd [RankTool]); [] = full toolset
  experiment_dir: null      # null = tự cấp exp_NNN/ dưới outputs.agent_eval; campaign overlay set đường tuyệt đối
                            # tới campaigns/<id>/<exp>/run_N/ để config.yaml/metrics.json nằm chung run dir
  item_knn_reuse_cache: false  # true = load ItemKNN từ cache đã validate (data_hash + provenance + checksum)
                              # thay vì fit lại; cache miss/invalid -> fit fresh rồi save để các run sau dùng lại.
                              # Campaign overlay bật cái này + trỏ item_knn_dir vào <campaign>/item_knn/ để
                              # fit đúng 1 lần cho cả campaign (tiết kiệm ~33s + peak RAM ~1.2GB mỗi run).
  # Multi-turn conversation evaluation — runs once per run_agent_eval invocation,
  # after the main eval. Disabled by default. Per-experiment opt-in via campaign
  # agent_config.multi_turn (bool or dict); campaign policy never/once/all caps
  # how many runs execute it (see configs/evaluation/campaign.yaml).
  multi_turn:
    enabled: false
    dataset: "package/evaluation/multi_turn/conversations.jsonl"  # src/-relative
    output_dir: null   # null = write multi_turn.json into the experiment dir;
                       # set (abs path, or rel to experiments/) to redirect —
                       # campaign sets campaigns/<id>/multi_turn/ so the file
                       # lives in exactly one place.
    limits: {}         # Phase-C per-turn/conversation limit knobs (max_turns, turn_timeout_seconds,
                       # token budget...); nothing enforced yet. NOTE: keys here are PER-TURN/PER-CONVERSATION
                       # limits inside the eval — distinct from timeout_seconds below, which caps the WHOLE
                       # multi-turn subprocess. Don't confuse limits.turn_timeout_seconds (per turn) with
                       # timeout_seconds (whole step).
    timeout_seconds: 1800  # wall-clock cap for the ENTIRE multi-turn subprocess; timeout -> status "timeout".
                           # Per-turn limits belong under limits.* (Phase C), not here.
