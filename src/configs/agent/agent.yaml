# Agent config (mục XII, XIV, XX) — giới hạn runtime của PlanExecutor (package/agents/_limits.py).
# LLM provider/model nằm ở llm.yaml; file này chỉ chứa hành vi của vòng plan -> execute.

agent:
  max_steps: 8        # plan dài hơn bị cắt còn chừng này step (chặn cost/latency; kiểu max_tool_calls_per_request)
  plan_retries: 1     # số lần gọi lại LLM khi reply không phải plan JSON hợp lệ (0 = không retry)
  max_tokens: 2048    # ngân sách token cho 1 lần plan; model reasoning ăn token suy luận vào đây nên đừng đặt thấp
  temperature: 0.0    # 0 để plan lặp lại được giữa các lần chạy
  type1:              # Type1Agent (plan cố định, không LLM)
    candidate_multiplier: 5   # bước retrieve lấy top_k x hệ số này candidate để RecoModelTool còn chỗ xếp hạng lại
    min_candidates: 50        # ...nhưng không ít hơn chừng này
