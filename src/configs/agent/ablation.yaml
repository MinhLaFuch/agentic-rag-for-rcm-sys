# Config cho công cụ so sánh thí nghiệm (ablation comparison tool).
# Framework còn thay đổi, nên đây chỉ là base template - không gắn cứng vào ablation cụ thể.
# Khi framework ổn định, định nghĩa ablation cụ thể bằng cấu hình ở đây.

ablation:
  # Số resample bootstrap cho khoảng tin cậy
  bootstrap_resamples: 10000

  # Mức độ tin cậy (0.95 = 95%)
  confidence: 0.95

  # Số cặp nhỏ hơn thì in cảnh báo cạnh con số
  min_n_warn: 20

  # Seed cho bootstrap (để tái lập kết quả)
  seed: 42

  # Danh sách metric để so sánh (có thể dùng {k} thay bằng giá trị k từ config)
  # Các metric nhị phân: task_success, first_attempt_ok, tool_selection_ok, asked_clarification
  # Các metric liên tục: recall@{k}, ndcg@{k}, constraint_satisfaction, reflections, llm_latency_seconds, completion_tokens
  metrics:
    - task_success
    - recall@{k}
    - ndcg@{k}
    - constraint_satisfaction
    - first_attempt_ok
    - reflections
    - llm_latency_seconds
    - completion_tokens
    - answer_fallback            # tỉ lệ câu trả lời LLM bị thay bằng template
    - inference_latency_seconds  # độ trễ riêng của bước Inference
    - inference_completion_tokens

  # Nhóm (group): nhãn -> danh sách các thư mục exp_NNN của cấu hình đó
  # Ví dụ: config_a là cấu hình có reflect_rounds=0, config_b là reflect_rounds=1
  # Các thư mục là tương đối experiments_dir/agent_eval/
  # Muốn có khoảng tin cậy từ nhiều lần lặp: thêm exp vào cùng group, ví dụ reflect_0: [exp_005, exp_007]
  groups:
    reflect_1: [exp_004]        # reflect_rounds=1, Inference llm (lần chạy đầy đủ trong báo cáo)
    reflect_0: [exp_007]        # reflect_rounds=0, Inference llm
    infer_template: [exp_008]   # reflect_rounds=1, Inference template

  # Danh sách các contrast để so sánh
  # Mỗi contrast: name (tên), a (agent, group), b (agent, group), kinds (tuỳ chọn, nếu bỏ thì so tất cả)
  contrasts:
    # Tác dụng của reflect (a = không reflect, b = có reflect)
    - name: planner_reflect0_vs_reflect1
      a: [planner, reflect_0]
      b: [planner, reflect_1]
    - name: planner_memory_reflect0_vs_reflect1
      a: [planner_memory, reflect_0]
      b: [planner_memory, reflect_1]

    # Tác dụng của MemoryTool trên cùng một lần chạy (a = không memory, b = có memory)
    - name: memory_vs_no_memory
      a: [planner, reflect_1]
      b: [planner_memory, reflect_1]
      kinds: [similar, constrained, cold_text]  # personalized của planner không được chấm nên bỏ

    # Inference: template so với llm (a = template, b = llm)
    - name: planner_memory_template_vs_llm
      a: [planner_memory, infer_template]
      b: [planner_memory, reflect_1]
    - name: planner_template_vs_llm
      a: [planner, infer_template]
      b: [planner, reflect_1]
    - name: type1_template_vs_llm
      a: [type1, infer_template]
      b: [type1, reflect_1]

  # Đường dẫn xuất báo cáo (tương đối experiments_dir)
  output_subdir: "agent_eval/ablation"