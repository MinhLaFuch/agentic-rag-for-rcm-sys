# Config cho công cụ so sánh thí nghiệm (ablation comparison tool).
# Ablation scope: campaign_001, template inference, reflect_rounds {0,1},
# agents {baseline, planner, planner_memory}. KHÔNG claim ablation ngoài
# agent-layer (retrieval/embedding thuộc effort khác — xem docs/ablation_scope.md).

ablation:
  # Số resample bootstrap cho khoảng tin cậy
  bootstrap_resamples: 10000

  # Mức độ tin cậy (0.95 = 95%)
  confidence: 0.95

  # Số cặp nhỏ hơn thì in cảnh báo cạnh con số
  min_n_warn: 20

  # Seed cho bootstrap (để tái lập kết quả)
  seed: 42

  # Danh sách metric để so sánh (có thể dùng {k} thay bằng giá trị k từ config)
  # Các metric nhị phân: task_success, first_attempt_ok, tool_selection_ok, asked_clarification
  # Các metric liên tục: recall@{k}, ndcg@{k}, constraint_satisfaction, reflections, llm_latency_seconds, completion_tokens
  metrics:
    - task_success
    - recall@{k}
    - ndcg@{k}
    - constraint_satisfaction
    - first_attempt_ok
    - reflections
    - llm_latency_seconds
    - completion_tokens
    - answer_fallback            # tỉ lệ câu trả lời LLM bị thay bằng template
    - inference_latency_seconds  # độ trễ riêng của bước Inference
    - inference_completion_tokens

  # Nhóm (group): nhãn -> đường dẫn exp dir tương đối experiments/agent_eval/.
  # Campaign layout: campaigns/<campaign_id>/<exp_name>/run_<N>/.
  # Template 2x2 (planner-memory x reflect) + baseline ItemKNN, đều inference_mode=template.
  groups:
    # --- 2x2: planner x planner_memory, reflect 0 vs 1 (template) ---
    planner_tmpl_r0:   [campaigns/campaign_001/exp_5_agents_planner_inference_mode_template_reflect_rounds_0_multi_turn_True/run_1]
    planner_tmpl_r1:   [campaigns/campaign_001/exp_6_agents_planner_inference_mode_template_reflect_rounds_1_multi_turn_True/run_1]
    pmem_tmpl_r0:      [campaigns/campaign_001/exp_9_agents_planner_memory_inference_mode_template_reflect_rounds_0_multi_turn_True/run_1]
    pmem_tmpl_r1:      [campaigns/campaign_001/exp_10_agents_planner_memory_inference_mode_template_reflect_rounds_1_multi_turn_True/run_1]
    # --- Baseline ItemKNN (agent='baseline', không LLM, chỉ kinds similar/personalized/exclusion) ---
    baseline_itemknn:  [campaigns/campaign_001/exp_1_agents_baseline_type1_inference_mode_template_reflect_rounds_0_multi_turn_True/run_1]
    # --- Tương lai: -Rank (planner_memory - RankTool) và các biến thể llm ---
    # Chạy campaign với agent_config.exclude_tools: [RankTool] rồi thêm group tại đây.
    # pmem_tmpl_r1_norank: [campaigns/campaign_001/<exp_name>/run_1]

  # Danh sách các contrast để so sánh
  # Mỗi contrast: name (tên), a (agent, group), b (agent, group), kinds (tuỳ chọn)
  contrasts:
    # Tác dụng của reflect trên planner_memory (a = reflect 0, b = reflect 1)
    - name: reflect_effect_planner_memory
      a: [planner_memory, pmem_tmpl_r0]
      b: [planner_memory, pmem_tmpl_r1]
    # Tác dụng của reflect trên planner (không memory)
    - name: reflect_effect_planner
      a: [planner, planner_tmpl_r0]
      b: [planner, planner_tmpl_r1]

    # Tác dụng của MemoryTool ở reflect=1.
    # kinds loại personalized: planner không memory trả task_success=None cho
    # personalized và công cụ generic này coi None như False trong McNemar —
    # phân tích personalized đúng (loại cặp None, báo effective n) nằm ở
    # scripts/experiments/pairwise_ablation.py.
    - name: memory_effect_reflect1
      a: [planner, planner_tmpl_r1]
      b: [planner_memory, pmem_tmpl_r1]
      kinds: [similar, exclusion, unanswerable, ambiguous]

    # Baseline ItemKNN vs full agent (planner_memory reflect=1).
    # Baseline chỉ xử lý được similar/personalized/exclusion; ambiguous và
    # unanswerable không áp dụng được (không có request tương ứng -> pairwise
    # script báo "not applicable").
    - name: baseline_vs_full_agent
      a: [baseline, baseline_itemknn]
      b: [planner_memory, pmem_tmpl_r1]
      kinds: [similar, personalized, exclusion]

  # Đường dẫn xuất báo cáo: outputs.ablation trong configs/path/data_paths.yaml
  # (tương đối experiments_dir → experiments/agent_eval/ablation/)
